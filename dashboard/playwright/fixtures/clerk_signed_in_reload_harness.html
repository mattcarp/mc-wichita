    <script type="module">
      globalThis.__WICHITA_SKIP_AUTH_GATE_AUTOMAIN__ = true;

      window.fetch = async (input) => {
        if (String(input).includes("clerk-env.json")) {
          return new Response(
            JSON.stringify({
              publishableKey: "pk_test",
              frontendApi: "https://example.clerk.accounts.dev",
              emailLinkRedirectUrl: "/",
            }),
            { headers: { "Content-Type": "application/json" } },
          );
        }
        if (String(input).includes("dashboard.js")) {
          return new Response("export {};", { headers: { "Content-Type": "text/javascript" } });
        }
        throw new Error(`unexpected fetch ${input}`);
      };

      window.Clerk = {
        user: {
          id: "reload_user",
          firstName: "Mattie",
          primaryEmailAddress: { emailAddress: "mattie@wichitawire.com" },
        },
        session: { getToken: async () => "jwt" },
        client: { signIn: {} },
        async load() {},
        addListener() {},
        async signOut() {
          this.user = null;
        },
      };

      const { bootstrapAuthGate } = await import("/dashboard/clerk_gate.js?v=20261011-clerk7");
      await bootstrapAuthGate();
      window.__wichitaAuthReady = true;
    </script>
