<!-- header -->
<text class="t" x="48" y="66" font-size="24" letter-spacing="6">SOTTO SOUND · WICHITA · RECEIVE ONLY</text>
<text class="t" x="46" y="150" font-size="86" font-weight="700" letter-spacing="1">FIELD KIT — XATT IL-LANCA</text>
<text class="g" x="48" y="200" font-size="26">10 November 2026 · one hour · Sally Port steps above the Sliema ferry landing, Marsamxett</text>
<rect x="48" y="222" width="2064" height="4" fill="#f4f4f4"/>

