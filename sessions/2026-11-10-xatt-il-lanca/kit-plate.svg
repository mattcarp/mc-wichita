  <text class="g" x="30" y="438" font-size="23">Carries the laptop, the mat, the spare jacket.</text>
  <text class="g" x="30" y="470" font-size="23">Stone steps, late sun: sit on something.</text>
</g>

<g transform="translate(0,540)"><rect x="48" y="1900" width="2064" height="2" fill="#3a3a3a"/>

<!-- measure -->
<text class="t" x="48" y="1976" font-size="34" font-weight="700" letter-spacing="1">THE MEASURE</text>
<text class="g" x="48" y="2022" font-size="25">Fun is usable signal × usable information, per minute out there, minus the attention it takes. Value is what the hour</text>
<text class="g" x="48" y="2058" font-size="25">leaves behind: real received voice, real AIS, a timestamped log. An item earns its place only if it raises one of those</text>
<text class="g" x="48" y="2094" font-size="25">without lowering another — a bag you cannot carry, or a battery you flatten, lowers all three.</text>

<text class="pk" x="48" y="2160" font-size="22" font-weight="700" letter-spacing="3">FRONT-LOADED ORDER</text>
<text class="g" x="48" y="2200" font-size="24">5–30 AIS and CH16 · 30–40 sweep, bounded · 40–50 pocket toys on the walk · 50–60 out. Nothing starts after 40.</text>

<!-- legend -->
<rect x="48" y="2260" width="2064" height="2" fill="#3a3a3a"/>
<g font-size="23">
  <text class="t" x="48" y="2308" font-weight="700">1</text><text class="g" x="80" y="2308">Mag mount, 3 whips</text>
  <text class="t" x="720" y="2308" font-weight="700">2</text><text class="g" x="752" y="2308">RTL-SDR — AIS</text>
  <text class="t" x="1392" y="2308" font-weight="700">3</text><text class="g" x="1424" y="2308">SDRplay — voice</text>
  <text class="t" x="48" y="2350" font-weight="700">4</text><text class="g" x="80" y="2350">HackRF / PortaPack</text>
  <text class="t" x="720" y="2350" font-weight="700">5</text><text class="g" x="752" y="2350">UV-K5 — airband</text>
  <text class="t" x="1392" y="2350" font-weight="700">6</text><text class="g" x="1424" y="2350">Flipper Zero — 433 sniff</text>
  <text class="t" x="48" y="2392" font-weight="700">7</text><text class="g" x="80" y="2392">Mount coax plug — part of 1</text>
  <text class="t" x="720" y="2392" font-weight="700">8</text><text class="g" x="752" y="2392">SMA–BNC pair</text>
  <text class="t" x="1392" y="2392" font-weight="700">9</text><text class="g" x="1424" y="2392">Coax, USB leads</text>
  <text class="t" x="48" y="2434" font-weight="700">10</text><text class="g" x="80" y="2434">Headphones</text>
  <text class="t" x="720" y="2434" font-weight="700">11</text><text class="g" x="752" y="2434">Adapter wallet — two only</text>
  <text class="t" x="1392" y="2434" font-weight="700">12</text><text class="g" x="1424" y="2434">Bag, sit mat</text>
</g>

<rect x="48" y="2486" width="2064" height="3" fill="#f2c200"/>
<text class="t" x="48" y="2538" font-size="26">The black tracker and the Flipper Zero travel. Nothing in this bag transmits.</text>
<text class="g" x="48" y="2576" font-size="22">All twelve drawn from the floor photographs of 9 November. Ground: Mattie's floor, not a studio.</text>

<rect x="48" y="2624" width="2064" height="2" fill="#3a3a3a"/>
<text class="pk" x="48" y="2674" font-size="22" font-weight="700" letter-spacing="3">STAYS HOME</text>
<text class="g" x="48" y="2714" font-size="23">The full adapter bag · the spare black tracker · the PortaPack's own rubber duck · third whip · chargers not</text>
<text class="g" x="48" y="2750" font-size="23">needed in the hour. If it is not on this plate it does not go in the bag.</text>

<!-- footer -->
<rect x="48" y="2818" width="2064" height="2" fill="#3a3a3a"/>
<text class="g" x="48" y="2858" font-size="20">Wichita · mc-wichita/sessions/2026-11-10-xatt-il-lanca · sheet 1 of 1 · drawn 10 November 2026</text>
<text class="g" x="48" y="2890" font-size="20">Receive only. Everything here listens; the UV-K5 is not keyed on the day.</text></g>
</svg>
