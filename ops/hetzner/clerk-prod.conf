# systemd drop-in: /etc/systemd/system/wichita-dashboard.service.d/clerk-prod.conf
# Points the Hetzner dashboard at Clerk's production instance (clerk.wichitawire.com).
# No secrets (the pk_live_ value below is a public Clerk publishable key): the backend verifies session JWTs against Clerk's public JWKS, and the
# publishable key is public by design. Code defaults stay on the dev instance so local
# runs on localhost keep working (production Clerk refuses non-production origins).
#
# Install:  sudo install -m 644 clerk-prod.conf /etc/systemd/system/wichita-dashboard.service.d/
#           curl -s https://clerk.wichitawire.com/.well-known/jwks.json | sudo tee /opt/wichita/data/clerk_jwks_prod.json
#           sudo systemctl daemon-reload && sudo systemctl restart wichita-dashboard
# Roll back to dev: remove this file, daemon-reload, restart.
[Service]
Environment=WICHITA_CLERK_PUBLISHABLE_KEY=pk_live_Y2xlcmsud2ljaGl0YXdpcmUuY29tJA
Environment=WICHITA_CLERK_FRONTEND_API=https://clerk.wichitawire.com
Environment=WICHITA_CLERK_JWKS_PATH=/opt/wichita/data/clerk_jwks_prod.json
